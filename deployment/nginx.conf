# Nginx 配置文件 - 商家入驻管理系统
# 用于生产环境部署

# 上游服务器配置
upstream grainadmin_api {
    # FastAPI/Uvicorn 后端服务
    server 127.0.0.1:8000 fail_timeout=0;
}

# HTTP 服务器 - 重定向到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;  # 替换为实际域名

    # ACME challenge（Let's Encrypt）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 重定向所有 HTTP 请求到 HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS 服务器 - 主配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;  # 替换为实际域名

    # SSL 证书配置（Let's Encrypt）
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/example.com/chain.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 日志配置
    access_log /var/log/nginx/grainadmin-access.log combined;
    error_log /var/log/nginx/grainadmin-error.log warn;

    # 客户端最大上传大小（文件上传）
    client_max_body_size 10M;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/x-javascript image/svg+xml;
    gzip_disable "msie6";

    # =====================================
    # API 后端代理 - /api/*
    # =====================================
    location /api/ {
        # 代理到 FastAPI/Uvicorn
        proxy_pass http://grainadmin_api;

        # 代理头设置
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # WebSocket 支持（如果需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 禁用缓冲（实时响应）
        proxy_buffering off;

        # 错误处理
        proxy_intercept_errors off;
    }

    # =====================================
    # API 文档 - /docs, /redoc, /openapi.json
    # =====================================
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://grainadmin_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =====================================
    # 管理后台前端 - /admin/*
    # =====================================
    location /admin/ {
        alias /var/www/grainadmin/admin-frontend/dist/;
        try_files $uri $uri/ /admin/index.html;

        # 静态资源缓存策略
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # HTML 不缓存
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # =====================================
    # 商家后台前端 - /merchant/*
    # =====================================
    location /merchant/ {
        alias /var/www/grainadmin/merchant-frontend/dist/;
        try_files $uri $uri/ /merchant/index.html;

        # 静态资源缓存策略
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # HTML 不缓存
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # =====================================
    # 上传文件访问 - /uploads/*
    # =====================================
    location /uploads/ {
        alias /var/data/grainadmin/uploads/;

        # 仅允许认证用户访问（通过 API 验证）
        # 实际项目中应该通过 API 生成签名 URL
        internal;  # 仅允许内部重定向访问

        # 防止目录列表
        autoindex off;
    }

    # =====================================
    # 健康检查 - /health
    # =====================================
    location /health {
        proxy_pass http://grainadmin_api;
        access_log off;  # 健康检查不记录日志
    }

    # =====================================
    # 根路径 - 重定向到管理后台
    # =====================================
    location = / {
        return 301 https://$server_name/admin/;
    }

    # =====================================
    # 错误页面
    # =====================================
    error_page 404 /404.html;
    location = /404.html {
        root /var/www/grainadmin/error-pages/;
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/grainadmin/error-pages/;
        internal;
    }

    # =====================================
    # 安全配置 - 禁止访问隐藏文件
    # =====================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# =====================================
# 配置说明
# =====================================
#
# 部署步骤：
# 1. 替换域名：将 example.com 替换为实际域名
# 2. 配置 SSL 证书：使用 Let's Encrypt 或其他 SSL 证书提供商
#    certbot --nginx -d example.com -d www.example.com
# 3. 创建必要的目录：
#    sudo mkdir -p /var/www/grainadmin/{admin-frontend,merchant-frontend}/dist
#    sudo mkdir -p /var/data/grainadmin/uploads
#    sudo mkdir -p /var/www/grainadmin/error-pages
# 4. 复制配置文件：
#    sudo cp deployment/nginx.conf /etc/nginx/sites-available/grainadmin
#    sudo ln -s /etc/nginx/sites-available/grainadmin /etc/nginx/sites-enabled/
# 5. 测试配置：
#    sudo nginx -t
# 6. 重载 Nginx：
#    sudo systemctl reload nginx
#
# 监控和维护：
# - 查看访问日志：sudo tail -f /var/log/nginx/grainadmin-access.log
# - 查看错误日志：sudo tail -f /var/log/nginx/grainadmin-error.log
# - 重载配置：sudo systemctl reload nginx
# - 重启服务：sudo systemctl restart nginx
#
# 性能优化建议：
# - 启用 HTTP/2（已配置）
# - 启用 Gzip 压缩（已配置）
# - 配置静态资源缓存（已配置）
# - 考虑使用 CDN 加速静态资源
# - 配置 rate limiting 防止 DDoS 攻击
#